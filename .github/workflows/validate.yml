name: Validate Axiom repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skills, workflows, and Markdown links
        run: python3 scripts/validate_repository.py
      - name: Check eval case structure (does not run models)
        run: python3 scripts/run_evals.py --check
      - name: Test maintainer scripts
        run: python3 -m unittest discover -s scripts/tests
